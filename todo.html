<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Fixed To-Do List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .page { 
            max-width: 600px; margin: 0 auto; 
            background: white; border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; 
        }
        .hidden { display: none !important; }
        .form-container { padding: 3rem 2.5rem; text-align: center; }
        h2 { color: #333; margin-bottom: 1rem; font-size: 2rem; }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: 500; }
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 1rem; border: 2px solid #e1e5e9; 
            border-radius: 12px; font-size: 1rem; 
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        button { 
            width: 100%; padding: 1.2rem; background: #667eea; 
            color: white; border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: 600; cursor: pointer; 
            transition: all 0.3s; margin-top: 0.5rem; 
        }
        button:hover:not(:disabled) { background: #5a67d8; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { 
            margin-top: 1rem; padding: 1rem; border-radius: 8px; 
            font-weight: 500; min-height: 24px; 
        }
        .success { background: #dcfce7; color: #166534; border-left: 4px solid #22c55e; }
        .error { background: #fef2f2; color: #dc2626; border-left: 4px solid #ef4444; }
        .demo { color: #888; font-size: 0.9rem; margin-top: 1rem; }
        
        /* Todo page */
        .todo-header { 
            background: linear-gradient(135deg, #059669 0%, #047857 100%); 
            color: white; padding: 2.5rem 2rem; text-align: center; 
        }
        .todo-header h1 { font-size: 2.2rem; margin-bottom: 0.25rem; }
        .welcome { opacity: 0.95; margin-bottom: 1rem; }
        #logoutBtn { 
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); 
            color: white; padding: 0.75rem 1.75rem; border-radius: 25px; 
            cursor: pointer; font-weight: 500; transition: all 0.3s; 
        }
        #logoutBtn:hover { background: white; color: #047857; }
        .todo-content { padding: 2.5rem; }
        .input-row { 
            display: flex; gap: 1rem; margin-bottom: 2rem; 
        }
        #taskInput { 
            flex: 1; padding: 1.2rem 1.5rem; border: 2px solid #d1d5db; 
            border-radius: 12px; font-size: 1.1rem; 
        }
        #taskInput:focus { border-color: #059669; }
        #addTaskBtn { 
            background: #3b82f6; color: white; border: none; 
            padding: 1.2rem 2.5rem; border-radius: 12px; cursor: pointer; 
            font-weight: 600; white-space: nowrap; 
        }
        #addTaskBtn:hover { background: #2563eb; }
        .stats-row { 
            display: flex; justify-content: space-between; 
            background: linear-gradient(90deg, #ecfdf5, #d1fae5); 
            padding: 1.25rem 2rem; border-radius: 16px; 
            margin-bottom: 2rem; font-weight: 600; font-size: 1.1rem; 
        }
        .task-list { list-style: none; }
        .task-item { 
            display: flex; align-items: flex-start; gap: 1rem; 
            padding: 1.5rem 2rem; background: #f9fafb; 
            border-radius: 16px; margin-bottom: 1rem; 
            border-left: 4px solid #e5e7eb; transition: all 0.3s; 
        }
        .task-item:hover { 
            transform: translateX(4px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            border-left-color: #059669; 
        }
        .task-item.completed { opacity: 0.8; border-left-color: #10b981; }
        .task-item.completed .task-text { 
            text-decoration: line-through; color: #6b7280; 
        }
        .task-checkbox { 
            width: 24px; height: 24px; margin-top: 2px; 
            accent-color: #10b981; cursor: pointer; 
        }
        .task-text { 
            flex: 1; font-size: 1.15rem; line-height: 1.5; padding-top: 2px; 
        }
        .task-delete { 
            background: #ef4444; color: white; border: none; 
            padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; 
            font-weight: 500; transition: background 0.2s; 
        }
        .task-delete:hover { background: #dc2626; }
        .empty-state { 
            text-align: center; padding: 4rem 2rem; 
            color: #6b7280; font-size: 1.3rem; 
        }
        .empty-state svg { font-size: 4rem; opacity: 0.5; margin-bottom: 1rem; display: block; }
    </style>
</head>
